# Example TLS-terminating reverse proxy (encryption in transit). Adapt certificates to the host institution.
server {
    listen 443 ssl http2;
    server_name irtcri.example.org;
    ssl_certificate     /etc/ssl/irtcri/fullchain.pem;
    ssl_certificate_key /etc/ssl/irtcri/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 50m;            # thermal/RGB uploads and spreadsheets
    location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
    location /health { proxy_pass http://127.0.0.1:8000; }
    location / { proxy_pass http://127.0.0.1:3000; }
}
server { listen 80; server_name irtcri.example.org; return 301 https://$host$request_uri; }
