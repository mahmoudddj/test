# Model family 1 - thermal image only (ImageNet-pretrained ResNet-18, 1-channel stem).
name: f1_thermal_resnet18
family: F1
dataset_root: var/data/datasets/irtcri_early_warning/0.1.0
model:
  kind: torch
  backbone: resnet18
  pretrained: true
  input_size: 224
  dropout: 0.3
training:
  seed: 42
  epochs: 30
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 6
  monitor: val_auroc
  imbalance: pos_weight
  augmentation: {hflip: false, rotate_deg: 10, translate: 0.05, scale: [0.9, 1.1], temp_offset_c: 0.3}
threshold: {rule: target_sensitivity, target: 0.85}
