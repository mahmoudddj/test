# Model family 0 - clinical-data-only baseline (penalised logistic regression).
name: f0_clinical_logreg
family: F0
dataset_root: var/data/datasets/irtcri_early_warning/0.1.0
model:
  kind: sklearn
  sklearn_estimator: logistic
  clinical_feature_groups: [clin, base, ep]
training:
  seed: 42
  imbalance: pos_weight
threshold: {rule: target_sensitivity, target: 0.85}
