# =============================================================================
# IRT-in-CRI Study - DATA DICTIONARY (machine-readable, single source of truth)
# =============================================================================
# Used by: Data Hub validation, CSV/Excel import, dataset builder, ML feature
# construction, DQ dashboard and documentation (docs/data_dictionary.md is
# generated from this file with `irtcri dictionary-docs`).
#
# Field semantics
#   name               machine-readable variable name (snake_case, stable)
#   label              human-readable label
#   entity             table in which values are stored
#                        observation  -> clinical_observation (repeated vitals/scores)
#                        laboratory   -> laboratory_result
#                        patient      -> patient (baseline)
#                        assessment   -> clinical_assessment (exit-site exam)
#                        image        -> thermal_image / rgb_image acquisition metadata
#   type               float | int | bool | category | string
#   unit               canonical (stored) unit; values are converted on entry
#   unit_alternatives  accepted input units: canonical = value * scale + offset
#   hard_range         physiologically impossible outside -> rejected (not stored)
#   plausible_range    unusual outside -> stored but flagged for data query
#   allowed_values     for category variables
#   missing            how missingness is represented (see `missing_codes`)
#   source             expected origin of the data
#   time_reference     which timestamp `event_time` denotes
#   availability       when the value becomes *knowable* (used for leakage control)
#                        event_time            -> knowable at event_time (+ lag_minutes)
#                        source_time           -> knowable at source_time (e.g. lab report time);
#                                                 if missing, event_time + lag_minutes
#   expected_interval_hours  protocol collection interval (missingness reporting)
#   required           counted in "missing required variables" DQ metrics
#   protocol_status    core | optional (protocol-approved but not mandatory)
#   aliases            accepted column names on import
#   validation         additional human-readable rules (cross-field rules are
#                      implemented in irtcri/schemas/dictionary.py::CROSS_FIELD_RULES)
# =============================================================================

version: "1.0.0"
missing_codes:
  ND: "Not done / not measured"
  NA: "Not applicable"
  UNK: "Unknown"
  NR: "Not recorded in source"
missing_default: "Stored as NULL value with optional missing_reason code (ND|NA|UNK|NR). No sentinel numbers (e.g. -99) are ever stored."

variables:
  # ---------------------------------------------------------------- vitals
  - name: temperature_c
    label: Body temperature
    entity: observation
    category: vital
    type: float
    unit: degC
    unit_alternatives: {degF: {scale: 0.5555556, offset: -17.7777778}}
    hard_range: [25.0, 45.0]
    plausible_range: [34.0, 41.5]
    source: nursing chart / bedside monitor / EHR
    time_reference: measurement time
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: 6
    required: true
    protocol_status: core
    aliases: [temp, temperature, body_temp]
  - name: heart_rate
    label: Heart rate
    entity: observation
    category: vital
    type: float
    unit: bpm
    hard_range: [0, 300]
    plausible_range: [30, 200]
    source: bedside monitor / nursing chart
    time_reference: measurement time
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: 6
    required: true
    protocol_status: core
    aliases: [hr, pulse]
  - name: spo2
    label: Oxygen saturation (pulse oximetry)
    entity: observation
    category: vital
    type: float
    unit: pct
    hard_range: [0, 100]
    plausible_range: [60, 100]
    source: bedside monitor
    time_reference: measurement time
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: 6
    required: true
    protocol_status: core
    aliases: [sao2_pulse, oxygen_saturation]
  - name: sbp
    label: Systolic blood pressure
    entity: observation
    category: vital
    type: float
    unit: mmHg
    hard_range: [0, 300]
    plausible_range: [50, 250]
    source: bedside monitor / nursing chart
    time_reference: measurement time
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: 6
    required: true
    protocol_status: core
    aliases: [systolic_bp]
    validation: ["sbp > dbp at the same timestamp"]
  - name: dbp
    label: Diastolic blood pressure
    entity: observation
    category: vital
    type: float
    unit: mmHg
    hard_range: [0, 250]
    plausible_range: [20, 150]
    source: bedside monitor / nursing chart
    time_reference: measurement time
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: 6
    required: true
    protocol_status: core
    aliases: [diastolic_bp]
    validation: ["dbp < sbp at the same timestamp"]
  - name: map
    label: Mean arterial pressure
    entity: observation
    category: vital
    type: float
    unit: mmHg
    hard_range: [0, 250]
    plausible_range: [30, 180]
    source: bedside monitor or derived (dbp + (sbp-dbp)/3)
    time_reference: measurement time
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: 6
    required: false
    protocol_status: core
    aliases: [mean_bp, mean_arterial_pressure]
    validation: ["dbp <= map <= sbp at the same timestamp"]
  - name: respiratory_rate
    label: Respiratory rate
    entity: observation
    category: vital
    type: float
    unit: per_min
    hard_range: [0, 80]
    plausible_range: [6, 50]
    source: nursing chart / bedside monitor
    time_reference: measurement time
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: 6
    required: true
    protocol_status: core
    aliases: [rr, resp_rate]
  - name: fio2
    label: Fraction of inspired oxygen
    entity: observation
    category: respiratory
    type: float
    unit: fraction
    unit_alternatives: {pct: {scale: 0.01, offset: 0}}
    hard_range: [0.21, 1.0]
    plausible_range: [0.21, 1.0]
    source: ventilator / oxygen prescription
    time_reference: time of setting
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: 6
    required: false
    protocol_status: core
    aliases: [fio2_fraction]
  - name: apache_ii
    label: APACHE II score
    entity: observation
    category: score
    type: int
    unit: points
    hard_range: [0, 71]
    plausible_range: [0, 60]
    source: ICU documentation (worst values of first 24 h)
    time_reference: end of the 24 h scoring window
    availability: {basis: event_time, lag_minutes: 0}
    expected_interval_hours: null
    required: false
    protocol_status: core
    aliases: [apache2, apache_2]
